[package]
name = "reachy_mini_mobile_app"
version = "0.3.1"
description = "Minimal Tauri client for Reachy Mini (BLE discovery + conversation iframe)"
authors = ["Thibaud Frere"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `lib` is required for mobile targets (iOS/Android) which build a shared
# library rather than a standalone binary. The `_lib` suffix avoids a clash
# with the `[[bin]]` target.
name = "reachy_mini_mobile_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables the WKWebView / WebView2 inspector AND the
# `WebviewWindow::open_devtools()` runtime API. Auto-disabled by
# Tauri in release builds via its own `cfg(debug_assertions)`
# guard on the binding, so shipping it is safe — the inspector is
# only callable while running in debug.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-os = "2"
tauri-plugin-http = "2"

# Opens a URL in the user's default browser. Used for non-auth flows
# (e.g. opening the conversation Space `*.hf.space` directly in Safari
# when the user explicitly asks to leave the app, or surfacing support
# links from the settings panel). The HuggingFace OAuth flow no longer
# uses this plugin: Apple App Review rejects flows that bounce out to
# Safari for sign-in, so OAuth now goes through ASWebAuthenticationSession
# (see `tauri-plugin-auth-session` below).
tauri-plugin-opener = "2"

# In-app OAuth via ASWebAuthenticationSession (iOS/macOS) and Chrome
# Custom Tabs (Android). Keeps the user inside the app for the entire
# sign-in dance, which is what Apple's App Store Review wants to see
# (any flow that hands off to Safari gets rejected as "poor UX").
#
# We pair the plugin with our existing loopback bridge (`oauth.rs`):
# HF still redirects to `http://localhost:8000/...` (its registered
# redirect URI, unchanged), our loopback emits a 302 to
# `reachymini://oauth/callback?<query>`, and the auth session
# intercepts the custom scheme to return the URL to the frontend.
# That way HF-side configuration stays untouched.
tauri-plugin-auth-session = "0.2"

# BLE client plugin - exact same dependency the desktop app uses. The
# plugin gives us a single-connection model that naturally fits the
# "persistent session" pattern we need for WiFi provisioning, and ships
# native Android support through the Tauri plugin system (on iOS, macOS,
# Linux and Windows it delegates to btleplug the same way we used to do
# directly). The bulk of the BLE logic now lives on the TS side, mirroring
# `reachy_mini_desktop_app/src/hooks/bluetooth/useBluetooth.ts`.
tauri-plugin-blec = "0.8"

# Keep the device's screen awake while the user is mid-session.
# Wraps `UIApplication.isIdleTimerDisabled` on iOS and the
# `FLAG_KEEP_SCREEN_ON` window flag on Android. The plugin compiles
# as a no-op on desktop targets so we can register it unconditionally
# (desktop dev preview falls back to `navigator.wakeLock` from the JS
# wrapper in `shared/tauri/keepScreenOn.ts`). We only enable the flag
# while the user is actively interacting with the robot (live
# conversation or open iframe app) - see `useKeepScreenOn` consumers.
tauri-plugin-keep-screen-on = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# HTTP client used by `daemon_fetch` and by the discovery probe step.
# Mobile WebViews refuse to call an unencrypted `http://` host from an
# `https://tauri.localhost` page (mixed content). Routing daemon calls
# through reqwest on the Rust side dodges that restriction and gives us a
# single source of truth for timeouts.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }

# Local IP enumeration (used to detect whether the phone is on the same
# subnet as the robot). Works on macOS, Linux, Windows, iOS, Android.
local-ip-address = "0.6"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local patch for btleplug CoreBluetooth panic
# "Got descriptors for a characteristic we don't know about".
# See: https://github.com/deviceplug/btleplug/issues/397
# Same patch the desktop app uses. `tauri-plugin-blec` transitively
# pulls in btleplug on iOS / macOS / Linux / Windows, so we still need
# this override until upstream is fixed.
[patch.crates-io]
btleplug = { path = "btleplug-patch" }
