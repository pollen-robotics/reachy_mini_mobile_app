name: Build mobile

# Triggered on:
#   - push to a `v*` tag         → builds iOS + Android, uploads to the matching release
#   - manual dispatch            → builds iOS + Android as artifacts (no release attach)
#
# What this workflow builds today
# ───────────────────────────────
# iOS    : *simulator* build (`aarch64-apple-ios-sim`). No code signing required,
#          no Apple Developer secrets needed. Produces a `.app` folder runnable
#          on the iOS Simulator. NOT installable on a physical iPhone.
# Android: *debug* APK. No keystore required. Installable via `adb install`
#          on any developer-mode Android device.
#
# What this workflow DOES build on tag `v*` (signed release path)
# ───────────────────────────────────────────────────────────────
# - `ios-release`: a signed iOS device build (`aarch64-apple-ios`)
#   uploaded to TestFlight via `xcrun altool`. Uses the secrets:
#     APPLE_TEAM_ID
#     APPLE_API_KEY_ID
#     APPLE_API_KEY_ISSUER_ID
#     APPLE_API_KEY_BASE64                (base64 of the .p8)
#     APPLE_CERTIFICATE_BASE64            (base64 of the Distribution .p12)
#     APPLE_CERTIFICATE_PASSWORD
#     APPLE_PROVISIONING_PROFILE_BASE64   (base64 of the .mobileprovision)
#     APPLE_APP_STORE_CONNECT_APP_ID      (numeric app id from App Store Connect)
#
# - `android-release`: a signed Android release (APK + AAB) uploaded
#   to Play Console's *Internal testing* track via the Play Developer
#   API. Mirrors the iOS pattern (Play upload only, no GH-release
#   attach — only the debug APK from the `android` job is attached).
#   Required secrets:
#     ANDROID_KEYSTORE_BASE64             (base64 of the .jks)
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
#     ANDROID_PLAY_SERVICE_ACCOUNT_JSON   (raw JSON of the Play API
#                                          service account, with
#                                          "Release manager" granted
#                                          on the listing)
#   Listing applicationId: `com.pollenrobotics.reachymini` (renamed
#   in CI from the auto-generated `com.pollen_robotics.reachy_mini`
#   to match the manually-created Play Console listing). versionCode
#   is pinned to ${{ github.run_number }} so each tag push gets a
#   fresh code without manual coordination.
#
# OpenAI access is brokered by the website Space's
# `/api/openai/ephemeral` endpoint (see
# `src/features/conversation/engine/ephemeral-key.ts` and the
# `OPENAI_API_KEY` secret on the website Space). The mobile bundle
# no longer carries a long-lived OpenAI key, so this workflow no
# longer needs an `OPENAI_API_KEY` repo secret or any build-time
# `VITE_OPENAI_API_KEY` injection - the equivalent step blocks
# were removed alongside the website-side mint endpoint.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_release:
        # When true, runs the signed `android-release` job (which
        # signs + uploads to Play Internal) even though we're on a
        # branch and not a tag. Useful for validating the
        # release/signing/Play-upload pipeline without burning a tag.
        # versionCode is still derived from `github.run_number` so
        # each manual run gets a fresh code Play will accept; the
        # versionName comes from `tauri.conf.json` (testers see the
        # same string as the most recent tag, just with a higher
        # build number).
        description: 'Run signed Android release (Play Internal upload)'
        type: boolean
        default: false
      ios_release:
        # Symmetric escape hatch for the iOS pipeline. Off by default
        # because TestFlight burn rate matters more than Play burn
        # rate.
        description: 'Run signed iOS release (TestFlight upload)'
        type: boolean
        default: false

concurrency:
  # Group key includes the workflow + the ref so each branch / tag
  # runs in its own concurrency lane. Pushing twice to the same
  # branch in quick succession therefore funnels both runs into
  # the same group, and the older one is auto-cancelled.
  #
  # `cancel-in-progress: true` is the safe default for an
  # iteration-heavy mobile pipeline: during release crunch we
  # routinely push 3-4 fix commits in a few minutes, and we don't
  # want two `ios-release` jobs racing to upload to TestFlight
  # with different `CFBundleVersion = github.run_number` values
  # (the older one would still successfully upload an outdated
  # build that testers might accidentally install).
  #
  # Tag pushes (`v*`) also fall under this rule. That's fine -
  # a re-pushed tag should always supersede the previous run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache Rust target dir
        # `Swatinem/rust-cache` is the canonical Rust action: it
        # hashes Cargo.lock + target fingerprints, prunes stale
        # intermediates, and persists `~/.cargo/{registry,git}`
        # plus `<workspace>/target` automatically. Distinct
        # `shared-key`s per job class (ios-sim / ios-device /
        # android-debug / android-release) prevent cross-job cache
        # eviction since they have different rustc fingerprints
        # (codegen-units, opt-level, debug/release).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ios-sim

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Strip developmentTeam from tauri.conf.json (simulator only)
        # The simulator SDK doesn't need a signed binary, but Xcode
        # still validates `DEVELOPMENT_TEAM` in TargetAttributes
        # (set from `bundle.iOS.developmentTeam` by `tauri ios init`)
        # against the runner's logged-in Apple IDs. With the Pollen
        # team `4KLHP7L6KP` baked in and no Apple ID in the runner,
        # the validation fails before our pbxproj patches get a
        # chance to disable signing.
        # Solution: clear the team in the cloned `tauri.conf.json`
        # before regenerating the Apple project, so the project file
        # never gets that DEVELOPMENT_TEAM in the first place.
        # The original config is untouched in git; this only affects
        # the runner's working copy.
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          path = 'src-tauri/tauri.conf.json'
          with open(path) as f:
              cfg = json.load(f)
          ios_cfg = cfg.get('bundle', {}).get('iOS', {})
          if 'developmentTeam' in ios_cfg:
              del ios_cfg['developmentTeam']
          # Drop empty iOS dict so tauri doesn't think we passed any
          # iOS-specific config it should respect.
          if not ios_cfg and 'iOS' in cfg.get('bundle', {}):
              del cfg['bundle']['iOS']
          with open(path, 'w') as f:
              json.dump(cfg, f, indent=2)
          print('Stripped developmentTeam for simulator build')
          PY

      - name: Regenerate Xcode project for runner toolchain
        # The committed `src-tauri/gen/apple/` was saved by a local Xcode
        # newer than what GH runners ship (project file format 77, from
        # Xcode 17+ / 26). Even macos-15 runners only have Xcode 16, which
        # refuses to open it with:
        #   The project ... cannot be opened because it is in a future
        #   Xcode project file format (77).
        # We sidestep the version skew by regenerating the Apple project
        # from scratch in CI before building. The runner's `tauri ios init`
        # produces a project in whatever format the runner's Xcode supports.
        # Local devs can keep the committed gen/apple as-is for Xcode 26.
        run: |
          set -euxo pipefail
          rm -rf src-tauri/gen/apple
          yarn tauri ios init --skip-targets-install || yarn tauri ios init || true
          # Regenerate the iOS / Android icon set from src-tauri/icons/icon.png.
          # `tauri ios init` creates the gen/apple project skeleton but does
          # NOT populate Assets.xcassets/AppIcon.appiconset with our brand
          # icon - it leaves the Tauri default placeholders, which is why
          # the first TestFlight build shipped with the wrong app icon.
          # Running `tauri icon` after init fixes it idempotently.
          yarn tauri icon src-tauri/icons/icon.png || true
          # App Store Connect rejects iOS icons with an alpha channel
          # (error 90717: "Invalid large app icon ... can't be transparent
          # or contain an alpha channel"). Our source icon keeps alpha
          # because Android adaptive icons need it; here we flatten every
          # iOS variant onto white so the IPA passes altool validation.
          # We use Pillow (pip install ~3s) instead of ImageMagick,
          # which isn't pre-installed on macos-26 runners. The runner's
          # system Python is PEP 668 "externally managed", so we pass
          # --break-system-packages: safe on an ephemeral runner, and
          # avoids spinning up a throwaway venv just for one import.
          # Idempotent.
          python3 -m pip install --quiet --disable-pip-version-check \
            --break-system-packages Pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for path in sorted(glob.glob(
              'src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-*.png'
          )):
              img = Image.open(path)
              if img.mode in ('RGBA', 'LA'):
                  bg = Image.new('RGB', img.size, (255, 255, 255))
                  bg.paste(img, mask=img.split()[-1])
                  bg.save(path, 'PNG')
                  print(f'flattened {path}')
          PY

      - name: Patch Info.plist for app permissions + Export Compliance
        # `tauri ios init` regenerates a barebones Info.plist that
        # only carries Tauri's defaults (orientations, launch
        # storyboard, etc.). We need to add:
        #   - All NSXxxUsageDescription keys our runtime triggers
        #     (mic, local network) - without them iOS aborts the
        #     corresponding API call AND the app gets rejected
        #     during App Store review.
        #   - ITSAppUsesNonExemptEncryption = NO so each TestFlight
        #     build doesn't surface "Missing Compliance" until a
        #     human goes click through the Export Compliance form.
        #     We use only standard HTTPS/TLS (talking to HF Space,
        #     OpenAI Realtime, WebRTC), which is exempt under the
        #     "uses standard encryption" carve-out.
        #
        # `plutil -insert` is idempotent enough for our needs; if a
        # key is already present we'd get a non-zero exit, so we
        # `-replace` instead which writes whether or not the key
        # exists.
        run: |
          set -euxo pipefail
          INFO_PLIST="src-tauri/gen/apple/reachy_mini_mobile_app_iOS/Info.plist"
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$INFO_PLIST"
          plutil -replace NSMicrophoneUsageDescription -string \
            "Reachy Mini needs microphone access to let you talk to the robot through voice conversations." \
            "$INFO_PLIST"
          plutil -replace NSLocalNetworkUsageDescription -string \
            "Reachy Mini needs local network access to talk to the robot daemon on port 8000." \
            "$INFO_PLIST"
          plutil -insert NSAppTransportSecurity \
            -xml "<dict><key>NSAllowsLocalNetworking</key><true/></dict>" \
            "$INFO_PLIST" 2>/dev/null || true
          # Background-audio capability: needed so the OpenAI Realtime
          # WebRTC session + WKWebView keep running when the user
          # locks the screen / backgrounds the app mid-conversation.
          # See `src-tauri/Info.plist` + the runtime keepalive in
          # `src/features/conversation/background-audio-keeper.ts`
          # for the full rationale. `-replace` with -xml is the
          # idempotent way to write an array key whether or not it
          # already exists in the plist.
          plutil -replace UIBackgroundModes \
            -xml "<array><string>audio</string></array>" \
            "$INFO_PLIST"
          echo '--- Info.plist after patch ---'
          plutil -p "$INFO_PLIST"

      - name: Disable code signing in pbxproj
        # Strip code-signing requirements for the unsigned simulator
        # build: the simulator SDK doesn't need a signed binary, but
        # Xcode still validates the project's `DEVELOPMENT_TEAM`
        # against the runner's logged-in Apple IDs (none on a fresh
        # CI runner). When that check fails we get:
        #   error: No Accounts: Add a new account in Accounts settings.
        #   error: No profiles for 'com.pollen-robotics.reachy-mini' were found
        # Disabling signing for this job (only) avoids the check
        # entirely. The signed device build runs in `ios-release` with
        # its own keychain + provisioning profile setup.
        #
        # We also force-link AuthenticationServices.framework here.
        # `tauri-plugin-auth-session` (HF OAuth via
        # ASWebAuthenticationSession) makes the Rust staticlib
        # (`libapp.a`) reference `_ASWebAuthenticationSessionErrorDomain`.
        # On the *device* SDK the framework gets autolinked, but the
        # *simulator* link drops it, so the unsigned sim build fails at
        # the link step with:
        #   Undefined symbols for architecture arm64:
        #     "_ASWebAuthenticationSessionErrorDomain"
        #   ld: symbol(s) not found for architecture arm64
        # The regenerated project has no OTHER_LDFLAGS at all, so we
        # inject one. `$(inherited)` keeps any default flags Xcode would
        # otherwise apply.
        run: |
          set -euxo pipefail
          PBXPROJ="src-tauri/gen/apple/reachy_mini_mobile_app.xcodeproj/project.pbxproj"
          python3 - "$PBXPROJ" <<'PY'
          import re, sys
          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()
          # Insert signing disablers at the top of every buildSettings
          # block. The pbxproj format wraps build settings in
          # `buildSettings = {` ... `};` blocks; we anchor on the
          # opener so the injection lands in both Debug and Release
          # configurations of every target/project node.
          injection = (
              '\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n'
              '\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "";\n'
              '\t\t\t\tDEVELOPMENT_TEAM = "";\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";\n'
              '\t\t\t\tOTHER_LDFLAGS = "$(inherited) -framework AuthenticationServices";\n'
          )
          new_content, n = re.subn(
              r'(buildSettings = \{\n)',
              r'\1' + injection,
              content,
          )
          if n == 0:
              print('ERROR: no buildSettings blocks matched in pbxproj', file=sys.stderr)
              sys.exit(1)
          with open(path, 'w') as f:
              f.write(new_content)
          print(f'Injected build settings into {n} buildSettings block(s)')
          PY

      - name: Build iOS (simulator, unsigned)
        # Tauri CLI's `--target` for iOS only accepts the short forms
        # `aarch64`, `aarch64-sim`, `x86_64`. The triple-style form
        # (`aarch64-apple-ios-sim`) is rejected even though it's what
        # `rustup target` uses. Keep the alias mapping in mind when
        # debugging matrix builds.
        run: yarn tauri ios build --target aarch64-sim

      - name: Locate and zip .app
        id: pack
        run: |
          set -euxo pipefail
          # Tauri's iOS build dropoff is somewhere under the Xcode DerivedData
          # tree. We grep for the freshest `.app` produced for the
          # iphonesimulator SDK to avoid pinning a Xcode build-version-specific
          # path.
          APP_PATH=$(find src-tauri/gen/apple/build -maxdepth 6 -name '*.app' -type d | head -1 || true)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 8 -path '*Build/Products/*-iphonesimulator/*.app' -type d | head -1 || true)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced - failing the job for visibility."
            find src-tauri/gen/apple -maxdepth 5 -type d | head -50
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          OUT="reachy-mini-mobile-ios-simulator-${{ github.sha }}.app.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

  android:
    name: Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free up disk space
        # ubuntu-latest runners ship with ~14 GiB free, not enough
        # for the Android build chain: NDK 27 (~2 GiB), four Rust
        # archs of intermediates (~6 GiB), Gradle caches (~3 GiB),
        # JNI libs merge (~2 GiB). Without this step the build
        # crashes during `mergeUniversalDebugJniLibFolders` with:
        #   java.nio.file.FileSystemException: ... No space left
        #   on device  (writing libreachy_mini_mobile_app_lib.so)
        # This action reclaims ~20 GiB by removing toolchains we
        # don't use (dotnet, haskell, pre-installed large packages,
        # docker images, swap). `android: false` preserves the
        # Android SDK that `setup-android` would otherwise have
        # to redownload. Tool-cache is preserved so the Node/Java
        # caches stay warm.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android \
                            armv7-linux-androideabi \
                            i686-linux-android \
                            x86_64-linux-android

      - name: Install Android NDK
        run: |
          set -euxo pipefail
          NDK_VERSION="27.0.12077973"
          sdkmanager --install "ndk;$NDK_VERSION"
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Cache Rust target dir
        # See the ios job for the rationale on using
        # Swatinem/rust-cache instead of the generic actions/cache.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-debug

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Initialize Android project (idempotent)
        run: |
          set -euxo pipefail
          if [ ! -d "src-tauri/gen/android" ]; then
            yarn tauri android init
          fi
          # Same icon-regeneration trick as the iOS jobs: tauri android
          # init creates the project skeleton with placeholder Tauri
          # icons in mipmap-*. Running tauri icon after init re-fills
          # them from src-tauri/icons/icon.png so the Android app ships
          # with the Reachy brand icon. Idempotent.
          yarn tauri icon src-tauri/icons/icon.png || true

      - name: Sync padded Android adaptive-icon foregrounds into gen/
        # Source-of-truth foregrounds in `src-tauri/icons/android/` are
        # pre-padded to fit the Android adaptive-icon 66/108dp safe
        # zone (the launcher mask would otherwise shave off Reachy's
        # antennas on circle/squircle/teardrop devices). Padding is
        # baked into the source PNGs by
        # `scripts/recompose-platform-icons.py` and committed under
        # `src-tauri/icons/android/` - we no longer pad in CI.
        # However `tauri android init` + `tauri icon` repopulate
        # `gen/android/app/src/main/res/mipmap-*/` with simple
        # rescales of `icon.png` (no padding). This step copies the
        # already-padded source foregrounds over the regenerated
        # rescales so the shipped APK uses the safe-zone version.
        # Idempotent. Re-run `scripts/recompose-platform-icons.py`
        # locally and commit the regenerated PNGs whenever the
        # source icon changes.
        run: |
          set -euxo pipefail
          GEN_RES="src-tauri/gen/android/app/src/main/res"
          if [ -d "$GEN_RES" ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              src="src-tauri/icons/android/$d/ic_launcher_foreground.png"
              dst="$GEN_RES/$d/ic_launcher_foreground.png"
              if [ -f "$src" ] && [ -d "$GEN_RES/$d" ]; then
                cp -f "$src" "$dst"
                echo "  synced: $dst"
              fi
            done
          fi

      - name: Patch AndroidManifest (app permissions + strip GPS injected by blec)
        # Two patches, applied together:
        #
        # 1. Add RECORD_AUDIO, MODIFY_AUDIO_SETTINGS, CAMERA so the
        #    WebView can grant those to iframe-hosted HF Spaces.
        # 2. Strip ACCESS_FINE_LOCATION + ACCESS_COARSE_LOCATION via
        #    `tools:node="remove"`. tauri-plugin-blec transitively
        #    declares both for pre-Android-12 BLE scanning, but no
        #    shipping Space surfaces geolocation and an unused
        #    "Location" permission on the Play listing is an App
        #    Review / Play Console red flag. Trade-off: BLE WiFi
        #    provisioning won't work on Android 8-11. Android 12+ is
        #    unaffected because blec also declares BLUETOOTH_SCAN
        #    with `neverForLocation`.
        #
        # Idempotent — re-running is a no-op once RECORD_AUDIO is in
        # the manifest.
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "xmlns:tools" not in s:
              s2 = re.sub(
                  r'(<manifest\s+xmlns:android="[^"]+")',
                  r'\1\n          xmlns:tools="http://schemas.android.com/tools"',
                  s, count=1,
              )
              if s2 == s:
                  print("::error::<manifest> root not found.", file=sys.stderr); sys.exit(1)
              s = s2
          # Lock the app to portrait (Android rotation block; mirrors the
          # iOS UISupportedInterfaceOrientations=Portrait in Info.plist).
          # The whole layout assumes a tall ~420px column; landscape breaks
          # the orb + safe-area math. Added to the MainActivity <activity>.
          if "screenOrientation" not in s:
              s2 = re.sub(
                  r'(android:name="[^"]*MainActivity")',
                  r'\1\n            android:screenOrientation="portrait"',
                  s, count=1,
              )
              if s2 == s:
                  print("::warning::MainActivity activity not matched for screenOrientation.", file=sys.stderr)
              else:
                  print("Locked MainActivity to portrait.")
              s = s2
          if "RECORD_AUDIO" not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" tools:node="remove" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" tools:node="remove" />\n\n'
                  '    <!-- AndroidTV support -->'
              )
              s2 = s.replace('    <!-- AndroidTV support -->', perms, 1)
              if s2 == s:
                  print("::error::<!-- AndroidTV support --> anchor not found.", file=sys.stderr); sys.exit(1)
              s = s2
              print("Injected app permissions + location-strip overrides.")
          else:
              print("Permissions already present, skipping.")
          p.write_text(s)
          PY

      - name: Patch AndroidManifest (reachymini:// intent-filter for AuthSessionActivity)
        # `tauri-plugin-auth-session` declares `AuthSessionActivity`
        # in its own manifest but, by design, leaves the OAuth-callback
        # intent-filter to the consumer app (the scheme is app-specific).
        # Without that filter, Chrome Custom Tabs has no Android handler
        # for `reachymini://oauth/callback?...`: the redirect dead-ends,
        # AuthSessionActivity's onResume fires a second time without
        # onNewIntent, the plugin emits "user_cancelled" and HF sign-in
        # is broken on every CI-built APK.
        #
        # We patch the regenerated manifest in CI rather than vendoring
        # `gen/android/`, mirroring the build.gradle.kts approach above.
        # Idempotent: re-running is a no-op once the filter is present.
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:scheme="reachymini"' in s:
              print("reachymini:// intent-filter already present, skipping.")
              sys.exit(0)

          # 1. Ensure xmlns:tools is on <manifest> (needed for tools:node="merge").
          if "xmlns:tools" not in s:
              s2 = re.sub(
                  r'(<manifest\s+xmlns:android="[^"]+")',
                  r'\1\n          xmlns:tools="http://schemas.android.com/tools"',
                  s, count=1,
              )
              if s2 == s:
                  print("::error::<manifest> root not found.", file=sys.stderr)
                  sys.exit(1)
              s = s2

          # 2. Inject AuthSessionActivity + intent-filter before </application>.
          # The first line has 4 spaces because str.replace preserves the
          # original line's leading whitespace (`    </application>`), so the
          # snippet's 4 spaces are added on top to reach the 8-space nesting
          # the surrounding <application> children use.
          snippet = (
              '    <activity\n'
              '            android:name="app.tauri.auth_session.AuthSessionActivity"\n'
              '            android:exported="true"\n'
              '            tools:node="merge">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.VIEW" />\n'
              '                <category android:name="android.intent.category.DEFAULT" />\n'
              '                <category android:name="android.intent.category.BROWSABLE" />\n'
              '                <data android:scheme="reachymini" />\n'
              '            </intent-filter>\n'
              '        </activity>\n'
              '    </application>'
          )
          s3 = s.replace("</application>", snippet, 1)
          if s3 == s:
              print("::error::</application> anchor not found in manifest.", file=sys.stderr)
              sys.exit(1)

          p.write_text(s3)
          print("Injected reachymini:// intent-filter on AuthSessionActivity.")
          PY

      - name: Build Android (debug APK)
        run: yarn tauri android build --debug --apk

      - name: Locate APK
        id: pack
        run: |
          set -euxo pipefail
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced - failing the job for visibility."
            find src-tauri/gen/android -maxdepth 8 -name '*.apk' -type f
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          # Don't `cp` to a renamed path: ubuntu runners are usually
          # tight on disk after Cargo/Gradle have built everything,
          # and the cp can fail with "No space left on device" right
          # before upload-artifact@v4 has had a chance to stream the
          # file out. We just point upload-artifact at the original
          # APK and use the action's `name` field to give the
          # artifact bundle its commit-stamped identity.
          echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: reachy-mini-mobile-android-debug-${{ github.sha }}
          path: ${{ steps.pack.outputs.apk }}
          if-no-files-found: error

  ios-release:
    name: iOS (signed, TestFlight)
    # Tag pushes always run this. Manual `workflow_dispatch` runs
    # only when the operator explicitly opts in via the
    # `ios_release` input — releasing every push to main would burn
    # TestFlight build slots and invite Apple-side rate-limiting.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.ios_release)
    # We don't `needs: ios` because the unsigned simulator build
    # already runs in parallel and a green simulator job doesn't
    # add real signal for the device build (different SDK, different
    # signing path).
    #
    # `macos-26` is the runner image with Xcode 26.x preinstalled,
    # which ships the iOS 26 SDK. Apple started enforcing
    # "all submissions must be built with iOS 26 SDK or later"
    # in 2026, so an Xcode 16-based macos-15 runner now produces
    # IPAs that App Store Connect rejects at upload with:
    #   SDK version issue. This app was built with the iOS 18.5 SDK.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode to the newest non-beta release
        # Three-pronged approach because Xcode discovery on macos-26
        # is deceptively layered:
        #
        #   1. `xcode-select -s` updates `/var/db/xcode_select_link`,
        #      which `xcrun` consults when DEVELOPER_DIR is unset.
        #   2. `DEVELOPER_DIR` env var, which `xcrun` / `xcodebuild`
        #      consult FIRST and which is pre-set by the runner image
        #      to point at whatever Xcode the image vendor decided
        #      was "default" (frequently a beta on macos-26).
        #   3. cargo-mobile2 (Tauri's iOS backend) appears to scan
        #      `/Applications/Xcode_*.app` directly, ignoring both
        #      mechanisms above, and picks the highest version by
        #      filename. That's why the previous pinning attempts
        #      kept landing back on `Xcode_26.5_beta_2.app`.
        #
        # We address all three at once: physically move beta /
        # preview / rc Xcodes out of `/Applications/` so the scan
        # can only find releases, then xcode-select + export the
        # newest one.
        #
        # Removing the betas is fine because GH runners are
        # ephemeral - the change vanishes when the job ends.
        run: |
          set -euxo pipefail
          echo '--- Xcode bundles before pruning ---'
          ls /Applications | grep -E '^Xcode_?' || true
          # Move beta-flavoured Xcode bundles out of the search path.
          # Using `mv` instead of `rm` so the parent disk usage stays
          # untouched (still on /Applications volume) but the apps
          # are no longer in the list cargo-mobile2 enumerates.
          for app in /Applications/Xcode_*.app; do
            case "$(basename "$app")" in
              *beta*|*preview*|*rc*|*Preview*|*Beta*|*RC*)
                sudo mv "$app" "/Applications/_hidden_$(basename "$app")"
                echo "Hid $app"
                ;;
            esac
          done
          echo '--- Xcode bundles after pruning ---'
          ls /Applications | grep -E '^Xcode_?' || true
          # Walk descending versions and pick the first one whose
          # Contents/Developer is a real directory. Some bundles
          # under /Applications/ on macos-26 are stubs / broken
          # symlinks (e.g. Xcode_26.5.0.app appearing alongside
          # Xcode_26.5.app, only one of which has a populated
          # Contents/Developer); xcode-select rejects those with
          # 'invalid developer directory'.
          XCODE_PATH=""
          for candidate in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr); do
            if [ -d "$candidate/Contents/Developer" ] && [ -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              XCODE_PATH="$candidate"
              break
            else
              echo "Skipping invalid Xcode bundle: $candidate"
            fi
          done
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app/Contents/Developer ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No usable Xcode found under /Applications"
            exit 1
          fi
          DEV_DIR="$XCODE_PATH/Contents/Developer"
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$DEV_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS device Rust target
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust target dir
        # See the ios (simulator) job for the rationale on using
        # Swatinem/rust-cache instead of the generic actions/cache.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ios-device

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Decode signing artifacts from secrets
        # We materialise the 3 binary secrets (cert, profile, API key)
        # as files under `signing/` because xcodebuild + altool both
        # take filesystem paths, not in-memory buffers. The folder is
        # workflow-local; runners are torn down after each job so
        # there's no persistence concern.
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euxo pipefail
          mkdir -p signing
          printf '%s' "$CERT_B64" | base64 --decode > signing/distribution.p12
          printf '%s' "$PROFILE_B64" | base64 --decode > signing/profile.mobileprovision
          # altool looks up API keys by KEY_ID under
          # ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8 unless
          # overridden by --apiKeyPath. Drop it in both places to be
          # robust against altool flag drift across Xcode versions.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 signing/AuthKey.p8

      - name: Set up signing keychain
        # Codesign on iOS picks the cert from the user's keychain. We
        # create a temporary keychain (auto-deleted with the runner)
        # rather than touching the runner's `login` keychain. The
        # `set-key-partition-list` step is the modern macOS dance to
        # let `codesign` use the imported key without interactive
        # confirmation.
        env:
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euxo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend our keychain to the user search list so codesign
          # finds the cert without `xcodebuild` needing extra flags.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security import signing/distribution.p12 -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Sanity log: list the imported identities.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        # Xcode auto-discovers profiles in this directory, no extra
        # config needed - it matches them by App ID + Distribution
        # Certificate to pick the right one at archive time.
        run: |
          set -euxo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Use a UUID-named filename so a stale leftover from a
          # previous build doesn't shadow the freshly decoded one.
          UUID=$(security cms -D -i signing/profile.mobileprovision \
                 | plutil -extract UUID xml1 -o - - \
                 | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cp signing/profile.mobileprovision "$DEST"
          echo "Installed profile UUID: $UUID -> $DEST"

      - name: Regenerate Xcode project for runner toolchain
        # See the comment in the simulator job: the committed
        # gen/apple was saved by Xcode 26 (project format 77) which
        # the runner's Xcode 16 can't open.
        run: |
          set -euxo pipefail
          rm -rf src-tauri/gen/apple
          yarn tauri ios init --skip-targets-install || yarn tauri ios init || true
          # Regenerate the iOS / Android icon set from src-tauri/icons/icon.png.
          # `tauri ios init` creates the gen/apple project skeleton but does
          # NOT populate Assets.xcassets/AppIcon.appiconset with our brand
          # icon - it leaves the Tauri default placeholders, which is why
          # the first TestFlight build shipped with the wrong app icon.
          # Running `tauri icon` after init fixes it idempotently.
          yarn tauri icon src-tauri/icons/icon.png || true
          # See the matching step in the simulator job: App Store Connect
          # rejects iOS icons with an alpha channel (altool error 90717).
          # Flatten every variant onto white so the signed IPA passes
          # validation. --break-system-packages because PEP 668 (runner
          # is ephemeral, so safe).
          python3 -m pip install --quiet --disable-pip-version-check \
            --break-system-packages Pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for path in sorted(glob.glob(
              'src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-*.png'
          )):
              img = Image.open(path)
              if img.mode in ('RGBA', 'LA'):
                  bg = Image.new('RGB', img.size, (255, 255, 255))
                  bg.paste(img, mask=img.split()[-1])
                  bg.save(path, 'PNG')
                  print(f'flattened {path}')
          PY

      - name: Patch Info.plist for app permissions + Export Compliance
        # See the matching step in the simulator job for full reasoning.
        # We replicate it here because the release job also goes through
        # `tauri ios init`, which regenerates the Info.plist from
        # scratch every run.
        run: |
          set -euxo pipefail
          INFO_PLIST="src-tauri/gen/apple/reachy_mini_mobile_app_iOS/Info.plist"
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$INFO_PLIST"
          plutil -replace NSMicrophoneUsageDescription -string \
            "Reachy Mini needs microphone access to let you talk to the robot through voice conversations." \
            "$INFO_PLIST"
          plutil -replace NSLocalNetworkUsageDescription -string \
            "Reachy Mini needs local network access to talk to the robot daemon on port 8000." \
            "$INFO_PLIST"
          plutil -insert NSAppTransportSecurity \
            -xml "<dict><key>NSAllowsLocalNetworking</key><true/></dict>" \
            "$INFO_PLIST" 2>/dev/null || true
          # Background-audio capability: needed so the OpenAI Realtime
          # WebRTC session + WKWebView keep running when the user
          # locks the screen / backgrounds the app mid-conversation.
          # See `src-tauri/Info.plist` + the runtime keepalive in
          # `src/features/conversation/background-audio-keeper.ts`
          # for the full rationale. `-replace` with -xml is the
          # idempotent way to write an array key whether or not it
          # already exists in the plist.
          plutil -replace UIBackgroundModes \
            -xml "<array><string>audio</string></array>" \
            "$INFO_PLIST"
          echo '--- Info.plist after patch ---'
          plutil -p "$INFO_PLIST"

      - name: Configure pbxproj for manual signing
        # Force MANUAL code signing. Tauri's regenerated project
        # defaults to ProvisioningStyle = Automatic, which makes
        # Xcode try to fetch a Development provisioning profile
        # via App Store Connect API (impossible without a logged-in
        # Apple ID on the runner). The build fails before our
        # archive ever starts with:
        #   error: No Accounts: Add a new account in Accounts settings.
        #   error: No profiles for 'com.pollen-robotics.reachy-mini' were found
        # We override:
        #   - TargetAttributes.ProvisioningStyle = Manual
        #   - buildSettings.CODE_SIGN_STYLE = Manual
        #   - buildSettings.PROVISIONING_PROFILE_SPECIFIER = "Reachy Mini App Store"
        #     (matches the .mobileprovision name we created on Apple Dev)
        #   - buildSettings.CODE_SIGN_IDENTITY = "Apple Distribution"
        #     (matches the cert we imported from the .p12)
        #   - buildSettings.DEVELOPMENT_TEAM = APPLE_TEAM_ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: 'Reachy Mini App Store'
        run: |
          set -euxo pipefail
          export PBXPROJ_PATH="src-tauri/gen/apple/reachy_mini_mobile_app.xcodeproj/project.pbxproj"
          python3 <<'PY'
          import os, re, sys
          path = os.environ['PBXPROJ_PATH']
          team = os.environ['APPLE_TEAM_ID']
          profile_name = os.environ['PROFILE_NAME']
          with open(path, 'r') as f:
              content = f.read()
          # buildSettings injection: manual signing.
          inj = (
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
              f'\t\t\t\tDEVELOPMENT_TEAM = {team};\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n'
          )
          # Use a callable replacement so re.subn doesn't interpret
          # `\1`, `\g<name>`, etc inside `inj` as backreferences.
          content, n = re.subn(
              r'buildSettings = \{\n',
              lambda m: m.group(0) + inj,
              content,
          )
          if n == 0:
              print('ERROR: no buildSettings blocks matched in pbxproj', file=sys.stderr)
              sys.exit(1)
          # TargetAttributes: flip ProvisioningStyle from Automatic to Manual.
          content = content.replace(
              'ProvisioningStyle = Automatic;',
              'ProvisioningStyle = Manual;',
          )
          with open(path, 'w') as f:
              f.write(content)
          print(f'Patched {n} buildSettings block(s) for manual signing')
          PY

      - name: Archive signed iOS app (export step expected to fail)
        # `tauri ios build --target aarch64` calls xcodebuild's
        # `archive` then `-exportArchive` actions. Tauri's auto-
        # generated exportOptions.plist for manual signing leaves
        # the `provisioningProfiles` map empty, which makes the
        # export step fail with:
        #   error: exportArchive "Reachy Mini.app" requires a
        #          provisioning profile.
        # The archive itself is fine - we re-export it manually with
        # our own exportOptions.plist in the next step. We trap the
        # failure so the workflow continues to that step.
        #
        # CFBundleVersion = github.run_number via `--config`:
        # Tauri 2.5+ supports a dedicated `bundle.iOS.bundleVersion`
        # field that maps to `CFBundleVersion` independently of
        # `tauri.conf.json:version` (which maps to the marketing
        # `CFBundleShortVersionString`). We override it inline via
        # `--config` so each CI run uploads with a unique, monotonic
        # build number to App Store Connect, without bumping the
        # marketing version. App Store Connect rejects an upload
        # that reuses an existing (CFBundleShortVersionString,
        # CFBundleVersion) pair, so pinning to `github.run_number`
        # is the canonical pattern to unblock repeat TestFlight
        # uploads from the same marketing version. This is the
        # officially-documented Tauri mechanism - see
        # https://v2.tauri.app/distribute/app-store/.
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uxo pipefail
          BUNDLE_VERSION_CONFIG=$(jq -nc --arg bv "${{ github.run_number }}" '{bundle:{iOS:{bundleVersion:$bv}}}')
          echo "Injecting Tauri config override: $BUNDLE_VERSION_CONFIG"
          yarn tauri ios build --target aarch64 \
            --export-method app-store-connect \
            --config "$BUNDLE_VERSION_CONFIG" || \
            echo "Tauri export step failed (expected; manual re-export follows)"

      - name: Locate xcarchive
        id: archive
        run: |
          set -euxo pipefail
          XCARCHIVE=$(find src-tauri/gen/apple/build -maxdepth 8 -name '*.xcarchive' -type d | head -1 || true)
          if [ -z "$XCARCHIVE" ]; then
            XCARCHIVE=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 10 -name '*.xcarchive' -type d | head -1 || true)
          fi
          if [ -z "$XCARCHIVE" ]; then
            echo "::error::No .xcarchive found - the archive step itself failed, not just the export."
            find src-tauri/gen/apple -maxdepth 6 -type d | head -30
            exit 1
          fi
          echo "Found archive at: $XCARCHIVE"
          echo "xcarchive=$XCARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Write exportOptions.plist for manual signing
        # Tauri's generated exportOptions.plist works for automatic
        # signing but doesn't populate `provisioningProfiles` for
        # manual signing. We write our own to map the bundle id
        # explicitly to the profile name we installed earlier.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pollen-robotics.reachy-mini</key>
              <string>Reachy Mini App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "--- exportOptions.plist ---"
          cat exportOptions.plist

      - name: Export IPA from archive
        # Re-run the export step with our hand-crafted plist. This
        # produces the .ipa next to the archive in `exported/`.
        run: |
          set -euxo pipefail
          mkdir -p exported
          xcodebuild -exportArchive \
            -archivePath "${{ steps.archive.outputs.xcarchive }}" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath exported \
            -allowProvisioningUpdates
          ls -la exported/

      - name: Verify CFBundleVersion in exported IPA
        # Sanity check: the `bundle.iOS.bundleVersion` config override
        # we passed to `tauri ios build --config ...` should have
        # propagated to the .app's Info.plist via xcodegen + agvtool,
        # and from there to the exported .ipa. If this prints anything
        # other than `CFBundleVersion = <run_number>`, the override
        # was not honoured - check tauri-cli version (>= 2.5.0
        # required) and the `--config` argument.
        run: |
          set -euxo pipefail
          IPA_PATH=$(find exported -maxdepth 2 -name '*.ipa' -type f | head -1)
          test -n "$IPA_PATH"
          echo "IPA: $IPA_PATH"
          # Unpack to a temp dir so we can `find` the .app bundle by
          # name (robust to spaces, e.g. `Reachy Mini.app`, which a
          # naive `awk $NF` parse of `unzip -l` would mangle).
          TEMP_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TEMP_DIR"
          APP_BUNDLE=$(find "$TEMP_DIR/Payload" -mindepth 1 -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::Could not locate .app bundle inside IPA"
            find "$TEMP_DIR" -maxdepth 3 -type d
            exit 1
          fi
          echo "App: $(basename "$APP_BUNDLE")"
          INFO_PLIST="$APP_BUNDLE/Info.plist"
          echo '--- final IPA Info.plist (version fields) ---'
          plutil -p "$INFO_PLIST" | grep -E 'CFBundleVersion|CFBundleShortVersionString'
          ACTUAL_BV=$(plutil -extract CFBundleVersion raw "$INFO_PLIST")
          EXPECTED_BV="${{ github.run_number }}"
          rm -rf "$TEMP_DIR"
          if [ "$ACTUAL_BV" != "$EXPECTED_BV" ]; then
            echo "::error::CFBundleVersion mismatch: got '$ACTUAL_BV', expected '$EXPECTED_BV'."
            echo "::error::The --config bundleVersion override didn't propagate. Check tauri-cli version (>=2.5.0)."
            exit 1
          fi
          echo "OK - CFBundleVersion = $ACTUAL_BV"

      - name: Locate IPA
        id: pack
        run: |
          set -euxo pipefail
          IPA_PATH=$(find exported -maxdepth 2 -name '*.ipa' -type f | head -1 || true)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA produced after manual export."
            find exported -maxdepth 3 | head -30
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          echo "ipa=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate IPA before upload
        # `xcrun altool --validate-app` runs the same pre-flight that
        # App Store Connect runs server-side. Catching format errors
        # here is faster (~30 s) than waiting for App Store Connect's
        # Activity tab to surface them after the upload (~5 min).
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          set -euxo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file "${{ steps.pack.outputs.ipa }}" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload to TestFlight
        # `xcrun altool --upload-app` ships the IPA to App Store
        # Connect's "Apps > TestFlight > iOS Builds" tab. Apple does
        # an automated processing step (5-15 min) before the build
        # becomes installable; we don't wait for that here, just
        # confirm the upload completed.
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          set -euxo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.pack.outputs.ipa }}" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: reachy-mini-mobile-ios-signed-${{ github.sha }}
          path: ${{ steps.pack.outputs.ipa }}
          if-no-files-found: error

      - name: Clean up signing materials
        if: always()
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          rm -rf signing
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

  android-release:
    name: Android (signed, Play Internal)
    # Tag pushes always run this. Manual `workflow_dispatch` runs
    # only when the operator opts in via `android_release` — without
    # the gate, every push to main would burn a Play versionCode and
    # spam internal testers with update prompts. Same shape as
    # `ios-release`.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.android_release)
    # No `needs:` — the unsigned debug APK runs in parallel and a
    # green debug build doesn't add real signal for the signed path
    # (different signing config, different applicationId, different
    # release/debug toolchain branch). Mirrors `ios-release`.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        # See the rationale in the debug Android job: the signed
        # release build needs even more disk (R8 shrinker, AAB
        # bundling, signing intermediates) so we reclaim ~20 GiB
        # before anything else runs. `android: false` preserves
        # the SDK / NDK that `setup-android` reuses below.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android \
                            armv7-linux-androideabi \
                            i686-linux-android \
                            x86_64-linux-android

      - name: Install Android NDK
        run: |
          set -euxo pipefail
          NDK_VERSION="27.0.12077973"
          sdkmanager --install "ndk;$NDK_VERSION"
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Cache Rust target dir
        # See the ios (simulator) job for the rationale on using
        # Swatinem/rust-cache. Distinct `shared-key` from the
        # android debug job because release artefacts have
        # different rustc fingerprints (codegen-units, opt-level,
        # debug=false) - sharing a cache would evict both jobs'
        # deps on every run.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-release

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            echo "Generate locally with: base64 -w0 reachy-mini.jks | pbcopy"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          # Sanity-check the file is a real JKS/PKCS12 (avoids the
          # confusing "Tag number over 30" gradle errors that mean
          # "your secret was empty / corrupted").
          file "$KEYSTORE_PATH"
          if ! file "$KEYSTORE_PATH" | grep -qi 'java keystore\|pkcs12\|data'; then
            echo "::error::Decoded keystore doesn't look like a JKS/PKCS12 file."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Initialize Android project (idempotent)
        # Same as the debug job: `tauri android init` regenerates
        # `gen/android/` from scratch on a clean checkout, so any
        # post-init patches must run *after* this step.
        run: |
          set -euxo pipefail
          if [ ! -d "src-tauri/gen/android" ]; then
            yarn tauri android init
          fi
          yarn tauri icon src-tauri/icons/icon.png || true

      - name: Sync padded Android adaptive-icon foregrounds into gen/
        # See the matching step in the debug job. The source
        # foregrounds under `src-tauri/icons/android/` are pre-padded
        # to the 66/108dp safe zone by
        # `scripts/recompose-platform-icons.py`; this step just
        # propagates them into the regenerated res/ tree because
        # `tauri icon` writes back un-padded rescales there.
        run: |
          set -euxo pipefail
          GEN_RES="src-tauri/gen/android/app/src/main/res"
          if [ -d "$GEN_RES" ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              src="src-tauri/icons/android/$d/ic_launcher_foreground.png"
              dst="$GEN_RES/$d/ic_launcher_foreground.png"
              if [ -f "$src" ] && [ -d "$GEN_RES/$d" ]; then
                cp -f "$src" "$dst"
                echo "  synced: $dst"
              fi
            done
          fi

      - name: Patch Android Gradle config (minSdk, applicationId, versionCode, signing)
        # The debug job only patches minSdk. Release adds three more:
        #
        # - applicationId: Tauri derives it from `tauri.conf.json`'s
        #   identifier (com.pollen-robotics.reachy-mini) by replacing
        #   `-` with `_`, so the auto-generated value is
        #   `com.pollen_robotics.reachy_mini`. Play Console expects
        #   `com.pollenrobotics.reachymini` (the listing was created
        #   with that id during the manual first upload). We rename
        #   only `applicationId` — namespace and Kotlin source paths
        #   stay as-generated, since Android allows applicationId to
        #   differ from the source package.
        #
        # - versionCode: Play rejects re-uploads with a versionCode
        #   that's already been used. We pin it to GITHUB_RUN_NUMBER
        #   (monotonically increasing across the entire repo) so each
        #   tag push gets a fresh code without manual coordination.
        #
        # - signingConfigs.release + buildTypes.release.signingConfig:
        #   wires our keystore (decoded above) into the release build.
        #   Reads keystore credentials from env so secrets never land
        #   in build.gradle.kts on disk.
        run: |
          set -euxo pipefail
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"
          test -f "$GRADLE_FILE"

          python3 - <<'PY'
          import os, re, pathlib, sys

          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text()
          original = s

          # 1. applicationId rename for Play Console listing.
          s2 = re.sub(
              r'applicationId\s*=\s*"com\.pollen_robotics\.reachy_mini"',
              'applicationId = "com.pollenrobotics.reachymini"',
              s,
          )
          if s2 == s:
              print("::warning::applicationId pattern not matched — Tauri layout may have changed.", file=sys.stderr)
          s = s2

          # 2. versionCode := GITHUB_RUN_NUMBER (monotonic, never collides).
          run_no = int(os.environ["GITHUB_RUN_NUMBER"])
          s3 = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {run_no}', s, count=1)
          if s3 == s:
              # Some Tauri versions don't emit versionCode at all; inject one.
              s3 = re.sub(
                  r'(defaultConfig\s*\{)',
                  rf'\1\n        versionCode = {run_no}',
                  s,
                  count=1,
              )
          s = s3

          # 3. signingConfigs block — read from env at build time.
          signing_block = (
              "    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            storeFile = file(System.getenv(\"ANDROID_KEYSTORE_PATH\"))\n"
              "            storePassword = System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n"
              "            keyAlias = System.getenv(\"ANDROID_KEY_ALIAS\")\n"
              "            keyPassword = System.getenv(\"ANDROID_KEY_PASSWORD\")\n"
              "        }\n"
              "    }\n\n"
          )
          # Insert just before the buildTypes block.
          s4 = re.sub(
              r'(\n[ \t]*)buildTypes\s*\{',
              r'\1' + signing_block + r'\1buildTypes {',
              s,
              count=1,
          )
          if s4 == s:
              print("::error::buildTypes anchor not found — can't inject signingConfigs.", file=sys.stderr)
              sys.exit(1)
          s = s4

          # 4. Wire the signingConfig into the release buildType.
          # Tauri uses `getByName("release") {` — we add a line inside it.
          s5 = re.sub(
              r'(getByName\("release"\)\s*\{)',
              r'\1\n            signingConfig = signingConfigs.getByName("release")',
              s,
              count=1,
          )
          if s5 == s:
              print("::error::release buildType anchor not found.", file=sys.stderr)
              sys.exit(1)
          s = s5

          if s == original:
              print("::error::No patches applied; aborting.", file=sys.stderr)
              sys.exit(1)

          p.write_text(s)
          print("--- patched build.gradle.kts ---")
          print(s)
          PY

      - name: Patch AndroidManifest (app permissions + strip GPS injected by blec)
        # Mirror of the debug job's "Patch AndroidManifest
        # (app permissions + strip GPS injected by blec)" step. See
        # that step for the full rationale. Idempotent.
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "xmlns:tools" not in s:
              s2 = re.sub(
                  r'(<manifest\s+xmlns:android="[^"]+")',
                  r'\1\n          xmlns:tools="http://schemas.android.com/tools"',
                  s, count=1,
              )
              if s2 == s:
                  print("::error::<manifest> root not found.", file=sys.stderr); sys.exit(1)
              s = s2
          # Lock the app to portrait (Android rotation block; mirrors the
          # iOS UISupportedInterfaceOrientations=Portrait in Info.plist).
          # The whole layout assumes a tall ~420px column; landscape breaks
          # the orb + safe-area math. Added to the MainActivity <activity>.
          if "screenOrientation" not in s:
              s2 = re.sub(
                  r'(android:name="[^"]*MainActivity")',
                  r'\1\n            android:screenOrientation="portrait"',
                  s, count=1,
              )
              if s2 == s:
                  print("::warning::MainActivity activity not matched for screenOrientation.", file=sys.stderr)
              else:
                  print("Locked MainActivity to portrait.")
              s = s2
          if "RECORD_AUDIO" not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" tools:node="remove" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" tools:node="remove" />\n\n'
                  '    <!-- AndroidTV support -->'
              )
              s2 = s.replace('    <!-- AndroidTV support -->', perms, 1)
              if s2 == s:
                  print("::error::<!-- AndroidTV support --> anchor not found.", file=sys.stderr); sys.exit(1)
              s = s2
              print("Injected app permissions + location-strip overrides.")
          else:
              print("Permissions already present, skipping.")
          p.write_text(s)
          PY

      - name: Patch AndroidManifest (reachymini:// intent-filter for AuthSessionActivity)
        # Mirror of the debug job's manifest patch. See the debug-job
        # step for the full rationale; in short, the OAuth callback
        # scheme `reachymini://` needs a host-app intent-filter on
        # `AuthSessionActivity`, otherwise HF sign-in dead-ends with
        # "user_cancelled" on the released APK. Idempotent.
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:scheme="reachymini"' in s:
              print("reachymini:// intent-filter already present, skipping.")
              sys.exit(0)

          if "xmlns:tools" not in s:
              s2 = re.sub(
                  r'(<manifest\s+xmlns:android="[^"]+")',
                  r'\1\n          xmlns:tools="http://schemas.android.com/tools"',
                  s, count=1,
              )
              if s2 == s:
                  print("::error::<manifest> root not found.", file=sys.stderr)
                  sys.exit(1)
              s = s2

          # The first line has 4 spaces because str.replace preserves the
          # original line's leading whitespace (`    </application>`), so the
          # snippet's 4 spaces are added on top to reach the 8-space nesting
          # the surrounding <application> children use.
          snippet = (
              '    <activity\n'
              '            android:name="app.tauri.auth_session.AuthSessionActivity"\n'
              '            android:exported="true"\n'
              '            tools:node="merge">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.VIEW" />\n'
              '                <category android:name="android.intent.category.DEFAULT" />\n'
              '                <category android:name="android.intent.category.BROWSABLE" />\n'
              '                <data android:scheme="reachymini" />\n'
              '            </intent-filter>\n'
              '        </activity>\n'
              '    </application>'
          )
          s3 = s.replace("</application>", snippet, 1)
          if s3 == s:
              print("::error::</application> anchor not found in manifest.", file=sys.stderr)
              sys.exit(1)

          p.write_text(s3)
          print("Injected reachymini:// intent-filter on AuthSessionActivity.")
          PY

      - name: Build Android (signed release APK + AAB)
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # `--apk --aab` produces both: APK for sideload-on-device QA
        # (downloaded from the workflow run page if needed); AAB for
        # the Play upload below.
        run: yarn tauri android build --apk --aab

      - name: Locate signed outputs
        id: pack
        # Tauri's release-build dropoff lives at:
        #   apk/universal/release/app-universal-release.apk
        #   bundle/universalRelease/app-universal-release.aab
        # i.e. it bakes a "universal" split into the path. We search
        # broadly under outputs/{apk,bundle} and pick the first
        # `*-release.{apk,aab}` so this stays resilient if Tauri/AGP
        # tweaks the layout again later.
        run: |
          set -euxo pipefail
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk \
            -name '*-release.apk' -type f \
            ! -name '*-unsigned*' | head -1 || true)
          AAB_PATH=$(find src-tauri/gen/android/app/build/outputs/bundle \
            -name '*-release.aab' -type f \
            ! -name '*-unsigned*' | head -1 || true)
          if [ -z "$APK_PATH" ] || [ -z "$AAB_PATH" ]; then
            echo "::error::Missing signed outputs — APK=$APK_PATH AAB=$AAB_PATH"
            find src-tauri/gen/android/app/build/outputs -maxdepth 6 -type f
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"
          echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        # apksigner is part of build-tools; this is a fast pre-flight
        # that fails the job before we waste time uploading an
        # unsigned/bad-signed artefact to Play (Play surfaces signing
        # errors only after a multi-minute upload).
        run: |
          set -euxo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose "${{ steps.pack.outputs.apk }}"

      - name: Upload AAB to Play Console (Internal Testing)
        # `r0adkll/upload-google-play@v1` calls the Play Developer API
        # using a service account JSON. Prereqs (one-time, manual):
        #   1. Play Console → Setup → API access → link a Google
        #      Cloud project, create a service account, download its
        #      JSON, and grant the SA "Release manager" on the app.
        #   2. Paste the full JSON into the
        #      ANDROID_PLAY_SERVICE_ACCOUNT_JSON repo secret.
        #   3. The first AAB MUST have been uploaded manually to
        #      create the listing (already done at v0.4.0).
        # `status: completed` rolls out to internal testers
        # immediately; switch to `draft` if you want to gate behind
        # a Play Console "Review and roll out" click.
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pollenrobotics.reachymini
          releaseFiles: ${{ steps.pack.outputs.aab }}
          track: internal
          # `status: draft` is required while the Play app itself
          # is still in draft state (i.e. has never been through
          # review). Completing the Play Console listing and
          # submitting one release for review moves the app out of
          # draft and unlocks `status: completed` for auto-rollout.
          # Until then each CI run uploads a draft you must roll out
          # manually in Play Console → Internal testing → "Review
          # release → Roll out to internal testing".
          status: draft
          # No whatsNewDirectory: Play falls back to the previous
          # release's notes. Acceptable for internal testing; switch
          # to a per-tag changelog later if testers ask for it.
          changesNotSentForReview: false

      - name: Clean up keystore
        if: always()
        run: |
          set +e
          rm -f "$ANDROID_KEYSTORE_PATH"

  attach-to-release:
    name: Attach to GitHub Release
    needs: [ios, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release if missing then upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          ls -laR artifacts
          shopt -s globstar nullglob
          mkdir -p release-files
          for f in artifacts/**/*; do
            if [ -f "$f" ]; then
              cp "$f" "release-files/$(basename "$f")"
            fi
          done
          ls -la release-files
          # Create the release if it doesn't exist yet. We don't
          # rely on the user having pre-created it via `gh release
          # create`: pushing the tag is sufficient. The release notes
          # default to the auto-generated changelog from the previous
          # tag, which is enough for an internal TestFlight build.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet, creating."
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" release-files/* \
            --repo "$REPO" --clobber
