<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Reachy Mini app icon: full-bleed cream tile with the two-eye mark.
       True vector (crisp at every size); iOS applies its own corner mask. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#ECEAE2"/>
  <g fill="#0d0d0d">
    <circle cx="315" cy="503" r="158"/>
    <circle cx="739" cy="500" r="131"/>
    <rect x="455" y="476" width="170" height="44" rx="22"/>
  </g>
  <g fill="#ECEAE2">
    <ellipse cx="372" cy="440" rx="42" ry="23" transform="rotate(-32 372 440)"/>
    <ellipse cx="788" cy="447" rx="32" ry="17" transform="rotate(-32 788 447)"/>
  </g>
</svg>
